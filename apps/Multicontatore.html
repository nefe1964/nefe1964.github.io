<!DOCTYPE html>
<!-- saved from url=(0051)https://nefe1964.github.io/apps/multicontatore.html -->
<html lang="it"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f2430">
<meta name="mobile-web-app-capable" content="yes">
<title>Multicontatore</title>
<style>
:root{
  --bg:#f3f4f7; --card:#ffffff; --ink:#1b1e27; --mute:#6b7280; --line:#e3e5ea;
  --bar:#1f2430; --barink:#fff; --accent:#3b82f6; --danger:#e5484d; --shadow:0 1px 3px rgba(0,0,0,.08);
}
body.dark{
  --bg:#111318; --card:#1c1f27; --ink:#eef0f4; --mute:#9aa1ad; --line:#2b2f3a;
  --bar:#0b0d11; --barink:#eef0f4; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;overscroll-behavior:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:12px;user-select:text}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}

/* top bar */
header{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barink)}
.top{display:flex;align-items:center;gap:6px;padding:10px 8px 6px 14px}
.top h1{flex:1;margin:0;font-size:19px;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:rgba(255,255,255,.12)}
.ib svg{width:22px;height:22px;fill:currentColor}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.08);font-size:14px;white-space:nowrap}
.tab.on{background:var(--barink);color:var(--bar);font-weight:600}
.tab.add{opacity:.8}

.sum{display:flex;justify-content:space-between;padding:10px 16px 2px;font-size:13px;color:var(--mute)}
main{padding:8px 10px 110px}
.list{display:flex;flex-direction:column;gap:8px}
.list.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* counter card */
.c{background:var(--card);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;overflow:hidden;position:relative;min-height:74px}
.c .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
.c .btn{width:64px;align-self:stretch;display:grid;place-items:center;font-size:30px;font-weight:300;flex:none}
.c .btn:active{background:var(--line)}
.c .mid{flex:1;min-width:0;padding:8px 4px;text-align:center}
.c .nm{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .val{font-size:32px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15}
.c .prog{height:4px;background:var(--line);border-radius:2px;margin:4px 10px 0;overflow:hidden}
.c .prog i{display:block;height:100%}
.c .tg{font-size:11px;color:var(--mute);margin-top:2px}
.c.done .val{color:#16a34a}
.grid .c{flex-direction:column;min-height:150px}
.grid .c .mid{order:-1;padding:14px 6px 6px;width:100%}
.grid .c .row{display:flex;width:100%;border-top:1px solid var(--line)}
.grid .c .btn{flex:1;height:52px;width:auto}
.c .row{display:contents}
.pop{animation:pop .18s}
@keyframes pop{50%{transform:scale(1.15)}}

.empty{text-align:center;color:var(--mute);padding:60px 20px;line-height:1.5}
.fab{position:fixed;right:18px;bottom:22px;width:60px;height:60px;border-radius:18px;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.undo{position:fixed;left:16px;bottom:30px;z-index:6;background:var(--bar);color:var(--barink);padding:12px 16px;border-radius:12px;font-size:14px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.undo b{color:#7cb4ff;margin-left:12px}

/* sheets & dialogs */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sh{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 26px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh h2{margin:0 0 6px;font-size:18px}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;padding:12px;border-radius:12px;background:var(--bg);font-weight:600}
.acts .pri{background:var(--accent);color:#fff}
.acts .dan{background:var(--danger);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.cols button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.cols button.on{border-color:var(--ink)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left}
.menu button:last-child{border-bottom:0}
.menu .dz{color:var(--danger)}
.chk{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:15px}
.chk input{width:auto;transform:scale(1.3)}

/* full screen counter */
.fs{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;color:#fff}
.fs.show{display:flex}
.fs .fh{display:flex;align-items:center;padding:10px 8px}
.fs .fh h3{flex:1;margin:0 8px;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .tap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fs .big{font-size:min(34vw,180px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.fs .hint{opacity:.75;font-size:14px;margin-top:10px}
.fs .fb{display:flex;height:96px}
.fs .fb button{flex:1;font-size:40px;background:rgba(0,0,0,.18)}
.fs .fb button+button{border-left:1px solid rgba(255,255,255,.2)}
.fs .fb button:active,.fs .tap:active{background:rgba(0,0,0,.12)}

.hist{list-style:none;padding:0;margin:10px 0 0;font-size:14px}
.hist li{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line)}
.hist .d{color:var(--mute)}
.pos{color:#16a34a}.neg{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--bar);color:var(--barink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Generale</h1>
    <button class="ib" id="bView" aria-label="Vista"><svg viewBox="0 0 24 24"><path id="viewIco" d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"></path></svg></button>
    <button class="ib" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></button>
  </div>
  <div class="tabs" id="tabs"><button class="tab on" data-g="g1">Generale <small style="opacity:.6">3</small></button><button class="tab add" data-g="+">＋ Gruppo</button></div>
</header>
<div class="sum" id="sum"><span>3 contatori</span><span>Totale <b style="color:var(--ink)">0</b></span></div>
<main><div class="list" id="list"><div class="c " data-id="mws283sdmsze">
      <span class="stripe" style="background:#3b82f6"></span>
      <div class="row"><button class="btn" data-a="-" style="color:#3b82f6">−</button></div>
      <div class="mid" data-a="open">
        <div class="nm">Visitatori</div>
        <div class="val" id="v_mws283sdmsze">0</div>
        
      </div>
      <div class="row"><button class="btn" data-a="+" style="color:#3b82f6">+</button></div>
    </div><div class="c " data-id="mws283sdx1h8">
      <span class="stripe" style="background:#22c55e"></span>
      <div class="row"><button class="btn" data-a="-" style="color:#22c55e">−</button></div>
      <div class="mid" data-a="open">
        <div class="nm">Ripetizioni</div>
        <div class="val" id="v_mws283sdx1h8">0</div>
        <div class="prog"><i style="width:0%;background:#22c55e"></i></div><div class="tg">0% di 50</div>
      </div>
      <div class="row"><button class="btn" data-a="+" style="color:#22c55e">+</button></div>
    </div><div class="c " data-id="mws283sdcovw">
      <span class="stripe" style="background:#f59e0b"></span>
      <div class="row"><button class="btn" data-a="-" style="color:#f59e0b">−</button></div>
      <div class="mid" data-a="open">
        <div class="nm">Scorte</div>
        <div class="val" id="v_mws283sdcovw">0</div>
        
      </div>
      <div class="row"><button class="btn" data-a="+" style="color:#f59e0b">+</button></div>
    </div></div></main>
<button class="fab" id="fab" aria-label="Nuovo contatore">+</button>
<div class="undo" id="undo"><span id="undoTxt"></span><b id="undoBtn">ANNULLA</b></div>
<div class="toast" id="toast"></div>

<div class="fs" id="fs">
  <div class="fh">
    <button class="ib" id="fsBack"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"></path></svg></button>
    <h3 id="fsName"></h3>
    <button class="ib" id="fsHist"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"></path></svg></button>
    <button class="ib" id="fsEdit"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"></path></svg></button>
  </div>
  <div class="tap" id="fsTap"><div class="big" id="fsVal">0</div><div class="hint" id="fsHint">Tocca per aumentare</div></div>
  <div class="fb"><button id="fsMinus">−</button><button id="fsReset">⟲</button><button id="fsPlus">+</button></div>
</div>

<div class="ov" id="ov"><div class="sh" id="sh"></div></div>

<script>
(function(){
const COLORS=['#3b82f6','#ef4444','#22c55e','#f59e0b','#a855f7','#ec4899','#14b8a6','#f97316','#64748b','#84cc16','#06b6d4','#8b5cf6'];
const KEY='multicontatore.v1';
let mem=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){} return mem}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S=load()||{groups:[{id:'g1',name:'Generale'}],counters:[],cur:'g1',grid:false,dark:false,vibe:true,sound:false,confirmMinus:false,tapFull:true};
if(!S.groups.length)S.groups=[{id:uid(),name:'Generale'}];
if(!S.groups.find(g=>g.id===S.cur))S.cur=S.groups[0].id;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{const r=Math.round(n*1000)/1000;return r.toLocaleString('it-IT')};

/* feedback */
let actx=null;
function fb(up){
  if(S.vibe){try{navigator.vibrate&&navigator.vibrate(up?18:[10,40,10])}catch(e){}}
  if(S.sound){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=up?880:440;g.gain.value=.06;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.05)}catch(e){}}
}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}

/* core ops */
let lastOp=null;
function change(c,delta,why){
  let nv=Math.round((c.value+delta)*1000)/1000;
  if(c.noNeg&&nv<0)nv=0;
  if(c.max!==''&&c.max!=null&&c.limit&&nv>+c.max)nv=+c.max;
  const d=Math.round((nv-c.value)*1000)/1000;
  if(!d&&why!=='reset')return;
  const prev=c.value;c.value=nv;
  c.hist.unshift({t:Date.now(),d:d,v:nv,w:why||''});
  if(c.hist.length>500)c.hist.length=500;
  lastOp={id:c.id,prev:prev};
  save();fb(d>0);
  if(c.target!==''&&c.target!=null&&prev<+c.target&&nv>=+c.target){toast('🎯 Obiettivo raggiunto: '+c.name);try{navigator.vibrate&&S.vibe&&navigator.vibrate([60,60,60])}catch(e){}}
  showUndo(c.name+': '+(d>0?'+':'')+fmt(d)+' → '+fmt(nv));
}
function showUndo(t){$('undoTxt').textContent=t;$('undo').style.display='block';clearTimeout(showUndo.t);showUndo.t=setTimeout(()=>$('undo').style.display='none',3500)}
$('undoBtn').onclick=()=>{if(!lastOp)return;const c=S.counters.find(x=>x.id===lastOp.id);if(c){c.value=lastOp.prev;c.hist.unshift({t:Date.now(),d:0,v:c.value,w:'annulla'});save();render();fsRender()}lastOp=null;$('undo').style.display='none'};

function inc(c){change(c,+c.step||1)}
function dec(c){
  if(S.confirmMinus){ask('Diminuire "'+c.name+'"?','',()=>{change(c,-(+c.step||1));render();fsRender()});return}
  change(c,-(+c.step||1))
}

/* render */
function curCounters(){return S.counters.filter(c=>c.g===S.cur)}
function render(){
  document.body.classList.toggle('dark',S.dark);
  $('viewIco').setAttribute('d',S.grid?'M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z':'M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z');
  const g=S.groups.find(g=>g.id===S.cur);
  $('title').textContent=g?g.name:'Multicontatore';
  $('tabs').innerHTML=S.groups.map(x=>`<button class="tab ${x.id===S.cur?'on':''}" data-g="${x.id}">${esc(x.name)} <small style="opacity:.6">${S.counters.filter(c=>c.g===x.id).length}</small></button>`).join('')+'<button class="tab add" data-g="+">＋ Gruppo</button>';
  const cs=curCounters();
  const tot=cs.reduce((a,c)=>a+c.value,0);
  $('sum').innerHTML=cs.length?`<span>${cs.length} contator${cs.length==1?'e':'i'}</span><span>Totale <b style="color:var(--ink)">${fmt(tot)}</b></span>`:'';
  const L=$('list');L.className='list'+(S.grid?' grid':'');
  if(!cs.length){L.innerHTML='<div class="empty">Nessun contatore in questo gruppo.<br>Tocca <b>+</b> per crearne uno.</div>';return}
  L.innerHTML=cs.map(c=>{
    const hasT=c.target!==''&&c.target!=null&&+c.target>0;
    const p=hasT?Math.max(0,Math.min(100,c.value/ +c.target*100)):0;
    return `<div class="c ${hasT&&c.value>=+c.target?'done':''}" data-id="${c.id}">
      <span class="stripe" style="background:${c.color}"></span>
      <div class="row"><button class="btn" data-a="-" style="color:${c.color}">−</button></div>
      <div class="mid" data-a="open">
        <div class="nm">${esc(c.name)}</div>
        <div class="val" id="v_${c.id}">${fmt(c.value)}</div>
        ${hasT?`<div class="prog"><i style="width:${p}%;background:${c.color}"></i></div><div class="tg">${Math.round(p)}% di ${fmt(+c.target)}</div>`:''}
      </div>
      <div class="row"><button class="btn" data-a="+" style="color:${c.color}">+</button></div>
    </div>`}).join('');
  if(S.grid){L.querySelectorAll('.c').forEach(el=>{const r=el.querySelectorAll('.row');const w=document.createElement('div');w.className='row';w.style.display='flex';w.append(r[0].firstElementChild,r[1].firstElementChild);r[0].remove();r[1].remove();el.append(w)})}
}
function bump(id){const e=$('v_'+id);if(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}}

/* list events */
let lpT=null,lpFired=false;
$('list').addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  const card=e.target.closest('.c');if(!card)return;
  const c=S.counters.find(x=>x.id===card.dataset.id);if(!c)return;
  const a=e.target.closest('[data-a]');const act=a?a.dataset.a:'open';
  if(act==='+'){inc(c);render();bump(c.id)}
  else if(act==='-'){dec(c);render();bump(c.id)}
  else openFs(c.id);
});
$('list').addEventListener('pointerdown',e=>{
  const card=e.target.closest('.c');if(!card)return;
  lpFired=false;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpFired=true;fb(true);counterMenu(card.dataset.id)},550);
});
['pointerup','pointercancel','pointerleave','pointermove'].forEach(ev=>$('list').addEventListener(ev,e=>{if(ev==='pointermove'&&Math.abs(e.movementY)<3)return;clearTimeout(lpT)}));
$('list').addEventListener('contextmenu',e=>e.preventDefault());

$('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  if(t.dataset.g==='+')return groupForm();
  if(t.dataset.g===S.cur)return groupMenu();
  S.cur=t.dataset.g;save();render();
});
$('fab').onclick=()=>counterForm();
$('bView').onclick=()=>{S.grid=!S.grid;save();render()};
$('bMenu').onclick=mainMenu;

/* overlay helpers */
function sheet(html,onMount){$('sh').innerHTML=html;$('ov').classList.add('show');onMount&&onMount($('sh'))}
function close(){$('ov').classList.remove('show')}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});
function ask(title,msg,ok,okTxt,danger){
  sheet(`<h2>${esc(title)}</h2><div style="color:var(--mute);font-size:14px">${msg}</div><div class="acts"><button id="no">Annulla</button><button class="${danger?'dan':'pri'}" id="yes">${okTxt||'OK'}</button></div>`,s=>{
    s.querySelector('#no').onclick=close;s.querySelector('#yes').onclick=()=>{close();ok()}})
}

/* counter form */
function counterForm(id){
  const c=id?S.counters.find(x=>x.id===id):null;
  const d=c||{name:'',value:0,step:1,color:COLORS[curCounters().length%COLORS.length],target:'',init:0,noNeg:false,max:'',limit:false,g:S.cur};
  let col=d.color;
  sheet(`<h2>${c?'Modifica contatore':'Nuovo contatore'}</h2>
    <label>Nome</label><input id="fName" value="${esc(d.name)}" placeholder="Es. Visitatori" maxlength="40">
    <div class="two"><div><label>Valore iniziale</label><input id="fInit" type="number" inputmode="decimal" value="${d.init}"></div>
    <div><label>Passo (+/−)</label><input id="fStep" type="number" inputmode="decimal" value="${d.step}" min="0"></div></div>
    <div class="two"><div><label>Obiettivo (facoltativo)</label><input id="fTarget" type="number" inputmode="decimal" value="${d.target}"></div>
    <div><label>Gruppo</label><select id="fGroup">${S.groups.map(g=>`<option value="${g.id}" ${g.id===d.g?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div>
    ${c?`<label>Valore attuale</label><input id="fVal" type="number" inputmode="decimal" value="${c.value}">`:''}
    <label>Colore</label><div class="cols" id="fCols">${COLORS.map(x=>`<button data-c="${x}" class="${x===col?'on':''}" style="background:${x}"></button>`).join('')}</div>
    <div class="chk"><span>Non scendere sotto zero</span><input type="checkbox" id="fNoNeg" ${d.noNeg?'checked':''}></div>
    <div class="chk"><span>Blocca al massimo</span><input type="checkbox" id="fLimit" ${d.limit?'checked':''}></div>
    <div id="fMaxW" style="display:${d.limit?'block':'none'}"><label>Valore massimo</label><input id="fMax" type="number" inputmode="decimal" value="${d.max}"></div>
    <div class="acts"><button id="cx">Annulla</button><button class="pri" id="ok">${c?'Salva':'Crea'}</button></div>`,s=>{
    s.querySelector('#fCols').onclick=e=>{const b=e.target.closest('button');if(!b)return;col=b.dataset.c;s.querySelectorAll('#fCols button').forEach(x=>x.classList.toggle('on',x===b))};
    s.querySelector('#fLimit').onchange=e=>s.querySelector('#fMaxW').style.display=e.target.checked?'block':'none';
    s.querySelector('#cx').onclick=close;
    if(!c)setTimeout(()=>s.querySelector('#fName').focus(),200);
    s.querySelector('#ok').onclick=()=>{
      const num=(v,def)=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?def:n};
      const name=s.querySelector('#fName').value.trim()||('Contatore '+(S.counters.length+1));
      const o={name,color:col,init:num(s.querySelector('#fInit').value,0),step:Math.abs(num(s.querySelector('#fStep').value,1))||1,
        target:s.querySelector('#fTarget').value===''?'':num(s.querySelector('#fTarget').value,''),g:s.querySelector('#fGroup').value,
        noNeg:s.querySelector('#fNoNeg').checked,limit:s.querySelector('#fLimit').checked,max:s.querySelector('#fMax').value===''?'':num(s.querySelector('#fMax').value,'')};
      if(c){Object.assign(c,o);const nv=num(s.querySelector('#fVal').value,c.value);if(nv!==c.value){c.hist.unshift({t:Date.now(),d:Math.round((nv-c.value)*1000)/1000,v:nv,w:'modifica'});c.value=nv}}
      else S.counters.push(Object.assign({id:uid(),value:o.init,hist:[{t:Date.now(),d:0,v:o.init,w:'creato'}],created:Date.now()},o));
      save();close();render();fsRender();
    };
  });
}

/* counter long-press menu */
function counterMenu(id){
  const c=S.counters.find(x=>x.id===id);if(!c)return;
  const cs=curCounters(),i=cs.indexOf(c);
  sheet(`<h2>${esc(c.name)}</h2><div class="menu">
    <button data-m="edit">✏️ Modifica</button>
    <button data-m="hist">🕘 Cronologia e statistiche</button>
    <button data-m="set">🔢 Imposta valore</button>
    <button data-m="reset">⟲ Azzera al valore iniziale (${fmt(c.init)})</button>
    <button data-m="dup">⧉ Duplica</button>
    ${i>0?'<button data-m="up">↑ Sposta su</button>':''}
    ${i<cs.length-1?'<button data-m="down">↓ Sposta giù</button>':''}
    <button data-m="del" class="dz">🗑 Elimina</button></div>`,s=>{
    s.querySelector('.menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=b.dataset.m;
      if(m==='edit')counterForm(id);
      else if(m==='hist')histSheet(id);
      else if(m==='set')setValue(id);
      else if(m==='reset')ask('Azzerare "'+c.name+'"?','Il valore torna a '+fmt(c.init)+'. Potrai annullare.',()=>{change(c,c.init-c.value,'reset');render();fsRender()},'Azzera',true);
      else if(m==='dup'){const n=JSON.parse(JSON.stringify(c));n.id=uid();n.name=c.name+' (copia)';n.hist=[{t:Date.now(),d:0,v:n.value,w:'creato'}];S.counters.splice(S.counters.indexOf(c)+1,0,n);save();close();render()}
      else if(m==='up'||m==='down'){const other=cs[m==='up'?i-1:i+1];const a=S.counters.indexOf(c),b2=S.counters.indexOf(other);[S.counters[a],S.counters[b2]]=[S.counters[b2],S.counters[a]];save();close();render()}
      else if(m==='del')ask('Eliminare "'+c.name+'"?','Il contatore e la sua cronologia saranno cancellati.',()=>{S.counters=S.counters.filter(x=>x.id!==id);save();render();if(fsId===id)closeFs()},'Elimina',true);
    }});
}
function setValue(id){
  const c=S.counters.find(x=>x.id===id);
  sheet(`<h2>Imposta valore</h2><label>${esc(c.name)}</label><input id="sv" type="number" inputmode="decimal" value="${c.value}">
  <div class="two" style="margin-top:10px"><button class="tab" style="background:var(--bg);padding:12px" id="addN">＋ Aggiungi</button><button class="tab" style="background:var(--bg);padding:12px" id="subN">− Sottrai</button></div>
  <div class="acts"><button id="cx">Annulla</button><button class="pri" id="ok">Imposta</button></div>`,s=>{
    const inp=s.querySelector('#sv');setTimeout(()=>{inp.focus();inp.select()},200);
    const n=()=>parseFloat(inp.value.replace(',','.'));
    s.querySelector('#cx').onclick=close;
    s.querySelector('#ok').onclick=()=>{if(!isNaN(n())){change(c,n()-c.value,'imposta')}close();render();fsRender()};
    s.querySelector('#addN').onclick=()=>{if(!isNaN(n())){change(c,n(),'aggiungi')}close();render();fsRender()};
    s.querySelector('#subN').onclick=()=>{if(!isNaN(n())){change(c,-n(),'sottrai')}close();render();fsRender()};
  });
}
function histSheet(id){
  const c=S.counters.find(x=>x.id===id);
  const ev=c.hist.filter(h=>h.d!==0);
  const plus=ev.filter(h=>h.d>0).reduce((a,h)=>a+h.d,0),minus=ev.filter(h=>h.d<0).reduce((a,h)=>a+h.d,0);
  const today=new Date().toDateString();
  const todayN=ev.filter(h=>new Date(h.t).toDateString()===today).reduce((a,h)=>a+h.d,0);
  const df=t=>new Date(t).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  sheet(`<h2>${esc(c.name)}</h2>
  <div class="two" style="font-size:14px;margin-top:8px">
   <div>Valore attuale<br><b style="font-size:22px">${fmt(c.value)}</b></div>
   <div>Oggi<br><b style="font-size:22px">${todayN>0?'+':''}${fmt(todayN)}</b></div>
   <div>Totale aggiunte<br><b class="pos">+${fmt(plus)}</b></div>
   <div>Totale sottrazioni<br><b class="neg">${fmt(minus)}</b></div>
  </div>
  <ul class="hist">${c.hist.slice(0,200).map(h=>`<li><span class="d">${df(h.t)}${h.w?' · '+h.w:''}</span><span><b class="${h.d>0?'pos':h.d<0?'neg':''}">${h.d>0?'+':''}${h.d?fmt(h.d):'·'}</b> → ${fmt(h.v)}</span></li>`).join('')}</ul>
  <div class="acts"><button id="clr" class="dan">Svuota cronologia</button><button class="pri" id="cx">Chiudi</button></div>`,s=>{
    s.querySelector('#cx').onclick=close;
    s.querySelector('#clr').onclick=()=>ask('Svuotare la cronologia?','Il valore attuale resta invariato.',()=>{c.hist=[{t:Date.now(),d:0,v:c.value,w:'cronologia svuotata'}];save()},'Svuota',true);
  });
}

/* groups */
function groupForm(id){
  const g=id?S.groups.find(x=>x.id===id):null;
  sheet(`<h2>${g?'Rinomina gruppo':'Nuovo gruppo'}</h2><label>Nome</label><input id="gn" value="${g?esc(g.name):''}" maxlength="30" placeholder="Es. Inventario">
  <div class="acts"><button id="cx">Annulla</button><button class="pri" id="ok">${g?'Salva':'Crea'}</button></div>`,s=>{
    setTimeout(()=>s.querySelector('#gn').focus(),200);
    s.querySelector('#cx').onclick=close;
    s.querySelector('#ok').onclick=()=>{const n=s.querySelector('#gn').value.trim()||'Gruppo '+(S.groups.length+1);
      if(g)g.name=n;else{const ng={id:uid(),name:n};S.groups.push(ng);S.cur=ng.id}save();close();render()};
  });
}
function groupMenu(){
  const g=S.groups.find(x=>x.id===S.cur),i=S.groups.indexOf(g);
  sheet(`<h2>Gruppo "${esc(g.name)}"</h2><div class="menu">
   <button data-m="ren">✏️ Rinomina</button>
   <button data-m="reset">⟲ Azzera tutti i contatori del gruppo</button>
   ${i>0?'<button data-m="l">← Sposta a sinistra</button>':''}
   ${i<S.groups.length-1?'<button data-m="r">→ Sposta a destra</button>':''}
   <button data-m="csv">📋 Copia gruppo come tabella (CSV)</button>
   ${S.groups.length>1?'<button data-m="del" class="dz">🗑 Elimina gruppo</button>':''}</div>`,s=>{
    s.querySelector('.menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=b.dataset.m;
      if(m==='ren')groupForm(g.id);
      else if(m==='reset')ask('Azzerare tutti?','Tutti i contatori di "'+g.name+'" tornano al valore iniziale.',()=>{curCounters().forEach(c=>{if(c.value!==c.init){c.hist.unshift({t:Date.now(),d:c.init-c.value,v:c.init,w:'reset'});c.value=c.init}});save();render()},'Azzera',true);
      else if(m==='l'||m==='r'){const j=m==='l'?i-1:i+1;[S.groups[i],S.groups[j]]=[S.groups[j],S.groups[i]];save();close();render()}
      else if(m==='csv'){copy(csv(curCounters()))}
      else if(m==='del')ask('Eliminare il gruppo?','Saranno eliminati anche i suoi '+curCounters().length+' contatori.',()=>{S.counters=S.counters.filter(c=>c.g!==g.id);S.groups.splice(i,1);S.cur=S.groups[0].id;save();render()},'Elimina',true);
    }});
}

/* export */
function csv(list){return 'Gruppo;Contatore;Valore;Obiettivo;Passo\n'+list.map(c=>[S.groups.find(g=>g.id===c.g)?.name||'',c.name,String(c.value).replace('.',','),c.target,c.step].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n')}
function copy(t){
  const done=()=>{close();toast('Copiato negli appunti')};
  try{navigator.clipboard.writeText(t).then(done,()=>showText(t))}catch(e){showText(t)}
}
function showText(t){sheet(`<h2>Copia il testo</h2><textarea id="tx" readonly>${esc(t)}</textarea><div class="acts"><button class="pri" id="cx">Chiudi</button></div>`,s=>{const x=s.querySelector('#tx');x.focus();x.select();s.querySelector('#cx').onclick=close})}

/* main menu */
function mainMenu(){
  sheet(`<h2>Menu</h2><div class="menu">
   <button data-m="grp">➕ Nuovo gruppo</button>
   <button data-m="gmenu">📁 Opzioni del gruppo corrente</button>
   <button data-m="csv">📋 Copia tutti i contatori (CSV)</button>
   <button data-m="exp">💾 Backup, copia i dati</button>
   <button data-m="imp">📥 Ripristina da backup</button>
   <button data-m="set">⚙️ Impostazioni</button>
   <button data-m="wipe" class="dz">🗑 Cancella tutti i dati</button></div>`,s=>{
    s.querySelector('.menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=b.dataset.m;
      if(m==='grp')groupForm();
      else if(m==='gmenu')groupMenu();
      else if(m==='csv')copy(csv(S.counters));
      else if(m==='exp')copy(JSON.stringify(S));
      else if(m==='imp')importSheet();
      else if(m==='set')settings();
      else if(m==='wipe')ask('Cancellare tutto?','Tutti i gruppi, i contatori e la cronologia saranno eliminati definitivamente.',()=>{S.groups=[{id:uid(),name:'Generale'}];S.counters=[];S.cur=S.groups[0].id;save();render()},'Cancella',true);
    }});
}
function importSheet(){
  sheet(`<h2>Ripristina da backup</h2><div style="color:var(--mute);font-size:14px">Incolla il testo copiato con "Backup". I dati attuali saranno sostituiti.</div><textarea id="tx" style="margin-top:10px;user-select:text"></textarea>
  <div class="acts"><button id="cx">Annulla</button><button class="pri" id="ok">Ripristina</button></div>`,s=>{
    s.querySelector('#cx').onclick=close;
    s.querySelector('#ok').onclick=()=>{try{const d=JSON.parse(s.querySelector('#tx').value);if(!d.groups||!d.counters)throw 0;S=Object.assign(S,d);if(!S.groups.find(g=>g.id===S.cur))S.cur=S.groups[0].id;save();close();render();toast('Dati ripristinati')}catch(e){toast('Testo non valido')}};
  });
}
function settings(){
  const row=(k,t)=>`<div class="chk"><span>${t}</span><input type="checkbox" data-k="${k}" ${S[k]?'checked':''}></div>`;
  sheet(`<h2>Impostazioni</h2>${row('dark','Tema scuro')}${row('vibe','Vibrazione')}${row('sound','Suono al tocco')}${row('confirmMinus','Conferma prima di diminuire')}${row('tapFull','Schermo intero, tocco ovunque per +')}${row('keepOn','Schermo sempre acceso nello schermo intero')}
  <div style="color:var(--mute);font-size:12px;margin-top:18px;line-height:1.5">Tieni premuto un contatore per il menu (modifica, cronologia, sposta, elimina). Tocca il nome del gruppo attivo per le sue opzioni. I dati restano su questo telefono, in questo browser.</div>
  <div class="acts"><button class="pri" id="cx">Fatto</button></div>`,s=>{
    s.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{S[i.dataset.k]=i.checked;save();render()});
    s.querySelector('#cx').onclick=close;
  });
}

/* full screen */
let fsId=null,wake=null;
function openFs(id){fsId=id;$('fs').classList.add('show');fsRender();
  if(S.keepOn){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
  try{history.pushState(null,'')}catch(e){}
}
function closeFs(){fsId=null;$('fs').classList.remove('show');try{wake&&wake.release()}catch(e){}wake=null;render()}
function fsRender(){
  if(!fsId)return;const c=S.counters.find(x=>x.id===fsId);if(!c)return closeFs();
  $('fs').style.background=c.color;$('fsName').textContent=c.name;$('fsVal').textContent=fmt(c.value);
  const hasT=c.target!==''&&c.target!=null&&+c.target>0;
  $('fsHint').textContent=(S.tapFull?'Tocca per +'+fmt(c.step):'')+(hasT?(S.tapFull?' · ':'')+'obiettivo '+fmt(+c.target)+' ('+Math.round(Math.min(100,c.value/ +c.target*100))+'%)':'');
}
function fsBump(){const e=$('fsVal');e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
$('fsTap').onclick=()=>{if(!S.tapFull)return;const c=S.counters.find(x=>x.id===fsId);inc(c);fsRender();fsBump()};
$('fsPlus').onclick=()=>{const c=S.counters.find(x=>x.id===fsId);inc(c);fsRender();fsBump()};
$('fsMinus').onclick=()=>{const c=S.counters.find(x=>x.id===fsId);dec(c);fsRender();fsBump()};
$('fsReset').onclick=()=>{const c=S.counters.find(x=>x.id===fsId);ask('Azzerare "'+c.name+'"?','Torna a '+fmt(c.init)+'.',()=>{change(c,c.init-c.value,'reset');fsRender()},'Azzera',true)};
$('fsBack').onclick=closeFs;
$('fsEdit').onclick=()=>counterForm(fsId);
$('fsHist').onclick=()=>histSheet(fsId);
window.addEventListener('popstate',()=>{if($('ov').classList.contains('show'))close();else if(fsId)closeFs()});

/* volume keys / keyboard: + and - in full screen */
document.addEventListener('keydown',e=>{if(!fsId||$('ov').classList.contains('show'))return;const c=S.counters.find(x=>x.id===fsId);
  if(['ArrowUp','+',' ','Enter','AudioVolumeUp'].includes(e.key)){e.preventDefault();inc(c);fsRender();fsBump()}
  else if(['ArrowDown','-','AudioVolumeDown'].includes(e.key)){e.preventDefault();dec(c);fsRender();fsBump()}});

/* first run demo */
if(!S.counters.length&&!S.seeded){S.seeded=true;
  [['Visitatori',COLORS[0],1,''],['Ripetizioni',COLORS[2],1,50],['Scorte',COLORS[3],5,'']].forEach(([n,col,st,t])=>S.counters.push({id:uid(),name:n,color:col,value:0,init:0,step:st,target:t,g:S.cur,noNeg:true,limit:false,max:'',hist:[{t:Date.now(),d:0,v:0,w:'creato'}]}));
  save();}
render();
})();
</script>


</body></html>
